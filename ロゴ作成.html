  <div>
    <button id="dl">PNG画像をダウンロード（1024×1024）</button>
  </div>
  <p class="note">ダウンロード先は通常「ダウンロード」フォルダです。<br>保存できたら教えてください。アプリのロゴ・アイコンに差し替えます。</p>

<script>
document.getElementById('dl').onclick = function(){
  var svg = document.getElementById('logo');
  var xml = new XMLSerializer().serializeToString(svg);
  var svg64 = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
  var img = new Image();
  img.onload = function(){
    var canvas = document.createElement('canvas');
    canvas.width = 1024; canvas.height = 1024;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, 1024, 1024);
    canvas.toBlob(function(blob){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'app-logo.png';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(a.href);
    }, 'image/png');
  };
  img.onerror = function(){ alert('画像の生成に失敗しました。もう一度お試しください。'); };
  img.src = svg64;
};
</script>
